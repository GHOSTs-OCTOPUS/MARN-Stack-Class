        //1. find factorial of given no n=5
        function facts() {

            let n = 5;
            let fact = 1;

            for (let i = 1; i <= n; i++) {
                fact = fact * i;
            }

            console.log("Question 1: Factorial =", fact);
            document.write("Question1: Factorial =", fact + "<br>");
        }
        facts();
        document.write("=============================================" + "<br>");


        //2. find given no is prime or not prime n=7 
        function prime() {
            i = 2;
            n = 7;
            flag = 0;
            while (i < n) {
                if (n % i == 0) {
                    flag = 1;
                }
                i++;
            }
            if (flag == 0) {
                console.log("Question 2: prime number");
                document.write("Question 2: prime number" + "<br>");
            } else {
                console.log("no is not prime");
                document.write("No. is not prime");
            }
        }
        prime();
        document.write("=============================================" + "<br>");




        //3.find given no is even or odd using fun n=9 

        function evenodd(n) {
            // n=9 
            if (n % 2 == 0) {
                console.log("Question3: no is even");
                document.write("Question3: no is even" + "<br>");
            } else {
                console.log("Question3: no is odd");
                document.write("Question3: no is odd" + "<br>");
            }
        }
        evenodd();
        document.write("=============================================" + "<br>");


        //4) find sum of given interval 1+2+3+...+10=55 
        function sum_of() {
            let sum = 0;

            for (let i = 1; i <= 10; i++) {
                sum = sum + i;
            }

            console.log("Question4: Sum =", sum);
            document.write("Question4: Sum =", sum + "<br>");
        }
        sum_of();
        document.write("=============================================" + "<br>");
