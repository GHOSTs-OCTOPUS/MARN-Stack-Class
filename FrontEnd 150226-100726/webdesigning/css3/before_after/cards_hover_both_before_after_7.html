<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* container */
.container {
    position: relative;
    width: 800px;
    height: 300px;
    margin: 50px auto;
}

/* common card style */
.card {
    position: absolute;
    width: 200px;
    height: 150px;
    background: white;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.5s;
}

/* manually positioning cards */
.card1 {
    left: 50px;
    top: 50px;
}

.card2 {
    left: 300px;
    top: 50px;
}

.card3 {
    left: 550px;
    top: 50px;
}

/* BEFORE effect */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: orange;
    transition: 0.5s;
    z-index: -1;
}

/* AFTER effect */
.card::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -100%;
    width: 100%;
    height: 100%;
    background: pink;
    transition: 0.5s;
    z-index: -2;
}

/* hover */
.card:hover::before {
    left: 0;
}

.card:hover::after {
    right: 0;
}

.card:hover {
    color: white;
    transform: translateY(-10px);
}
    </style>
</head>
<body>
    <div class="container">
    <div class="card card1">
        <h3>Card 1</h3>
        <p>First card</p>
    </div>

    <div class="card card2">
        <h3>Card 2</h3>
        <p>Second card</p>
    </div>

    <div class="card card3">
        <h3>Card 3</h3>
        <p>Third card</p>
    </div>
</div>
</body>
</html>
