<html>
<head>
    <title>Smart Image Gallery Slider With Transitions Effects</title>

    <script src="jquery-1.4.4.min.js" type="text/javascript"></script>

    <link href="smart-gallery.css" rel="stylesheet" type="text/css" />

    <script src="smart-gallery.min.js" type="text/javascript"></script>

    <script type="text/javascript">
        $(document).ready(function() {
        $('#smart-gallery').gallery({ stickthumbnails: true, random: true});
        });
    </script>
	<style type="text/css">
        body
        {
            margin: 0;
            padding: 0;
            background-color: white;
        }
		.min-gallary{
		
		width:100%;
		height:500px;
		}
    </style>
</head>
	<body>
		<div id="smart-gallery" class="min-gallary">
		<a href="desert.jpg"><img src="desert.jpg"></a>
		<a href="tulips.jpg"><img src="tulips.jpg"></a>
		<a href="koala.jpg "><img src="koala.jpg"></a>
		</div>
	</body>
</html>
