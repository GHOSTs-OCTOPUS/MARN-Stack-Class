<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        .main {
            width: 100%;
            height: 100%;
            margin: auto;
            background: url(./img/index.jpg)  no-repeat;
            background-size: 100% 100%;
        }

        .header {
            width: 100%;
            height: 100px;
        }
        .header .logo {
            float: left;
            padding-left: 30px;
        }
        .header h1 {
            font-family: poppins;
            float: left;
            line-height: 60px;
            color: white;
            padding-left: 30px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header .nav ul li {
            list-style: none;
            float: right;
            width: 100px;
            height: 50px;
            line-height: 50px;
            font-size: 20px;
            color: white;
        }

        .cont {
            width: 100%;
            height: 675px;
        }

        .footer {
            width: 100%;
            height: 50px;
        }

        .cont h1 {
            font-family: book antiqua;
            color: white;
            padding-top: 220px;
            padding-left: 30px;
            font-size: 50px;
        }

        .cont p {
            font-family: book antiqua;
            color: white;
            padding-left: 30px;
            padding-top: 10px;
            font-size: 25px;
        }
        .cont button a {
            color: white;
            text-decoration: none;
        }

        .nav ul li a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            float: left;
            text-align: center;
            height: 50px;
            width: 100px;
            font-size: 20px;
        }

        .nav ul li:hover {
            background: #06a20641;
            border-radius: 10px;
            height: 50px;
            width: 100px;
            font-size: 25px;
        }

        button {
            color: white;
            background: #33aa3fa1;
            font-size: 20px;
            height: 50px;
            width: 10%;
            border-radius: 50px;
            margin-left: 150px;
            margin-top: 40px;
            border: none;
        }

        .footer p {
            float: left;
            color: white;
            line-height: 50px;
            width: 10%;
            padding-left: 30px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="header">
            <div class="logo">
                <img src="./img/8d06e920460053.562ebaf3bfc45.gif" alt="logo" width="60px" height="60px">
            </div>
            <h1>National Park <i class="fa-solid fa-mug-hot"></i></h1>
            <div class="nav">
                <ul>
                    <li><a href="./contact.html">Contact us</a></li>
                    <li><a href="./explore.html">Explore</a></li>
                    <li><a href="./about.html">About Us</a></li>
                    <li><a href="./index.html">Home</a></li>
                </ul>
            </div>
        </div>
        <div class="cont">
            <h1>Welcome to National Park</h1>
            <p>Discover the beauty and wonder of our national parks.</p>
            <button><a href="./contact.html">Contact Us</a></button>
        </div>
        <div class="footer">
            <p>Terms & Services</p>
            <p>Privacy Policy</p>
            <p>Cookie Policy</p>
        </div>
    </div>
</body>
</html>
