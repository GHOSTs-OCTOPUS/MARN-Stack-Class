<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SVG Instagram Logo</title>
    <style>
        body {
            margin: 0;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* copyright */
        .footer {
            display: flex;
            flex-direction: column;
            background: #262526;
            border-top: 1px solid #6d6d6d;
            padding: 25px 0;
            text-align: center;
        }

        .copyright_text {
            color: #000000;
            font-size: 15px;
            margin-left: 30px;
        }

        .copyright_text a {
            font-size: larger;
            font-weight: bold;
            color: #fc95c4;
        }
    </style>
</head>

<body>
    <!-- Instagram Logo -->
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" style="background: #f0f0f0; border-radius: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
        <!-- Gradient Background -->
        <defs>
            <linearGradient id="instaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#feda75" />
                <stop offset="25%" stop-color="#fa7e1e" />
                <stop offset="50%" stop-color="#d62976" />
                <stop offset="75%" stop-color="#962fbf" />
                <stop offset="100%" stop-color="#4f5bd5" />
            </linearGradient>
        </defs>

        <!-- Rounded Square -->
        <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#instaGradient)" />

        <!-- Camera Outer Border -->
        <rect x="50" y="50" width="100" height="100" rx="30" fill="none" stroke="white" stroke-width="8" />

        <!-- Camera Lens -->
        <circle cx="100" cy="100" r="30" fill="none" stroke="white" stroke-width="8" />

        <!-- Small Circle (flash) -->
        <circle cx="130" cy="70" r="8" fill="white" />

    </svg>

    <!-- Copyright -->
    <footer>
        <div class="container">
            <p class="copyright_text">&copy;All Rights Reserved. Design by <a
                    href="https://github.com/GHOSTs-OCTOPUS">GHOSTs-OCTOPUS</a> Distribution by <a
                    href="https://cncwebworld.com/">CNC Web World</a></p>
        </div>
    </footer>




</body>

</html>
