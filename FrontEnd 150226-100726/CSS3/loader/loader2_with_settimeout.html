<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loader Example</title>




 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />




<style>
body{
    margin:0;
}


#loader{
    position: fixed;
    top: 40%;
    left: 40%;
  
    
    width:100px;
    height:100px;
    border:35px solid skyblue;
    border-top:35px solid blue;
    border-radius: 50%;
    animation: myani 2s infinite linear;
}


@keyframes myani{
    100%{transform: rotate(360deg);}
}

#content{
    display:none;
    text-align:center;
    padding:50px;
}

</style>

</head>

<body onload="fun()">

<div id="loader"></div>

<div id="content">
    <h1>Welcome to My Website 🚀</h1>

       <img src="https://images.unsplash.com/photo-1769292169556-2029133158ea?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"/>

       <img src="https://plus.unsplash.com/premium_photo-1769374455375-23cda1b8f406?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"/>


       <img src="https://images.unsplash.com/photo-1769399287930-7cdddd98ef3a?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"/>
       <img src="https://images.unsplash.com/photo-1769399287930-7cdddd98ef3a?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"/>


     <img src="https://images.unsplash.com/photo-1769117438355-a418184cddcf?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"/>


     <img src="https://img.freepik.com/free-photo/photorealistic-hummingbird-outdoors-nature_23-2151474112.jpg?semt=ais_hybrid&w=740&q=80"/>



     <img src="https://www.pixelstalk.net/wp-content/uploads/2016/05/Free-HD-Wallpaper-High-Quality.png"/>


     <img src="https://m.media-amazon.com/images/I/91Q2yYrAcZL._AC_UF1000,1000_QL80_.jpg"/>

       
</div>

<script>

//note:-- setTimeout(function, time_in_milliseconds)

function fun(){
     setTimeout(() => {
            document.getElementById("loader").style.display="none";
             document.getElementById("content").style.display = "block";
         }, 3000);
        }

</script>

</body>
</html>
