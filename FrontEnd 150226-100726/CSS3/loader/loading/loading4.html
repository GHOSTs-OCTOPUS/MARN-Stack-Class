<!DOCTYPE html>
<html>

<head>
  <style>
    #main {
      width: 150px;
      height: 150px;
      margin-left: 50%;
      margin-top: 50%;
      position: relative;
    }

    #d1 {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border: 16px dashed #3498db;
      width: 70px;
      height: 70px;
      position: absolute;
      top: 25px;
      left: 15px;
      -webkit-animation: myani 2s linear infinite;
      animation: myani 2s linear infinite;
    }

    @-webkit-keyframes myani {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes myani {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="main">
    <div id="d1"></div>
  </div>
</body>

</html>
