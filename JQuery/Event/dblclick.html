<!-- The dblclick() method attaches an event handler function to an HTML element. The function is executed when the user
double-clicks on the HTML element. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            $("p").dblclick(function () {
                $(this).hide();

                $("#menu").dblclick(function () {
                    $("#submenu").show();

                });

            });
        });


    </script>
</head>

<body>
    <p>welcome to cncwebworld</p>
    <p>welcome to cnc</p>

    <a href="#" id="menu">Menu</a>
    <div id="submenu" style="display:none">
        <a href="">Home </a><br />
        <a href="">About</a><br />
        <a href="">Contact</a>
    </div>


</body>

</html>
