<!-- The off() method is most often used to remove event handlers attached with the on() method. -->
<html>

<head>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            $("p").off("click", function () {
                alert("welcome");
            });
        });
    </script>
</head>

<body>
    <p>This is a paragraph</p>

</body>

</html>
