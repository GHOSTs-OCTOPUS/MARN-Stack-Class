<!-- The bind() method attaches One or more event handlers for selected elements, and specifies a function to run when the
event occurs. -->

<!DOCTYPE html>
<html>

<head>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            $("p").bind("click", function () {
                alert("Welcome");
            });
        });

    </script>
</head>

<body>
    <p>Click me!</p>

</body>

</html>
