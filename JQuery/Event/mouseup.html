<!-- The mouseup() method attaches an event handler function to an HTML element.The function is executed, when the left mouse
button is released, while the mouse is over the HTML element. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            $("p").mouseup(function () {
                $(this).hide();
            });
        });



    </script>
</head>

<body>

    <p>welcome to cncwebworld</p>
    <p>welcome to cnc</p>


</body>

</html>
