<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas_Template</title>
</head>
<body>
    <!-- canvas is a container only for graphics -->

    <canvas width="500" height="500" style="border:2px solid red" id="mycanvas"></canvas>

    <script>

        canvas = document.getElementById("mycanvas")
        context = mycanvas.getContext("2d")

        context.beginPath()
        x = 250
        y = 250
        r = 150
        sa = 0 * Math.PI
        ea = 2 * Math.PI
        ck = false

        context.arc(x, y, r, sa, ea, ck)
        context.lineWidth = 5
        context.strokeStyle = "green"
        context.stroke()

        context.beginPath()
        context.moveTo(250, 250)
        context.lineTo(450, 100)
        context.lineWidth = 5
        context.strokeStyle = "red"
        context.stroke()
    </script>

        <canvas width="500" height="500" style="border:2px solid red" id="canvas"></canvas>
    <script>
        canvas = document.getElementById("canvas")
        context = canvas.getContext("2d")

        context.beginPath()
        context.moveTo(150, 200)
        context.lineTo(350, 200)
        context.lineWidth = 5
        context.strokeStyle = "red"
        context.stroke()

        context.beginPath()
        context.moveTo(150, 200)
        context.lineTo(250, 450)
        context.lineWidth = 5
        context.strokeStyle = ""
        context.stroke()

        context.beginPath()
        context.moveTo(350, 200)
        context.lineTo(250, 450)
        context.lineWidth = 5
        context.strokeStyle = "red"
        context.stroke()

        context.beginPath()
        x = 250
        y = 200
        r = 100
        sa = 1 * Math.PI
        ea = 2 * Math.PI
        ck = false
        context.arc(x, y, r, sa, ea, ck)
        context.lineWidth = 5
        context.strokeStyle = "red"
        context.stroke()
        
        context.beginPath()
        x = 250
        y = 70
        r = 30
        sa = 0 * Math.PI
        ea = 2 * Math.PI
        ck = false
        context.arc(x, y, r, sa, ea, ck)
        context.lineWidth = 5
        context.strokeStyle = "red"
        context.stroke()
    
    </script>


    
</body>
</html>
