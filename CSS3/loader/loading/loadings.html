<!doctype html>
<html>
<head>
<style>
#main{
width:100px;height:100px;background:black;margin-left:50px;margin-top:50px;position:relative;
}
#d1{
width:15px;height:40px;background:green;position:absolute;bottom:20px;left:15px;
border-radius:15px;
animation:myani 1.5s 1s infinite ;
-webkit-animation:myani 1.5s 1s infinite ; 

}

@keyframes myani
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}
}

@-webkit-keyframes myani 
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}
}


#d2{
width:15px;height:40px;background:blue;position:absolute;bottom:20px;left:40px;
border-radius:15px;
animation:myanim 1.5s 0.5s infinite;
-webkit-animation:myanim 1.5s 0.5s infinite; /* Safari and Chrome */

}

@keyframes myanim
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}


}

@-webkit-keyframes myanim 
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}

}
#d3{
width:15px;height:40px;background:white;position:absolute;bottom:20px;left:70px;
border-radius:15px;
animation:myanima 1.5s 0s infinite;
-webkit-animation:myanima 1.5s 0s infinite; 

}

@keyframes myanima
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}
 
}

@-webkit-keyframes myanima 
{
0%   {height:10px;}
50%	{height:40px;}
100% {height:10px;}
}

</style>
</head>
<body>
<div id="main">
<div id="d1"></div>
<div id="d2"></div>
<div id="d3"></div>

</div>

 
</audio>

</body>
</html>
