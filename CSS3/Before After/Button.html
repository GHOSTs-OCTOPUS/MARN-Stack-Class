<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Animation</title>
    <link rel="stylesheet" href="./button1.css">
    <link rel="stylesheet" href="./button2.css">
    <link rel="stylesheet" href="./button3.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .section {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button1 {
            background-color: #EAEAEA;
        }

        .button3{
            background-color: #EAEAEA;
        }
        .button4{
            background-color: #EAEAEA;
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body>
    <section class="button1">
        <h1>Hover Buttons</h1>
        <div class="data-container">
            <span class="btn">Button</span>
            <span class="btn">Button</span>
            <span class="btn">Button</span>
            <span class="btn">Button</span>
            <span class="btn">Button</span>
        </div>
    </section>

    <section class="button2">
        <h1>Animation Buttons</h1>
        <div class="frame">
            <button class="custom-btn btn-1"><span>LIKE</span></button>
            <button class="custom-btn btn-2">FOLLOW</button>
            <button class="custom-btn btn-3"><span>SHARE!</span><span>THANKS</span></button>

        </div>
    </section>

    <section class="button3">
        <h1>Button With linear-gradient</h1>
        <div class="container">
            <button class="custom-btn btn-4"><span>Button</span></button>
        <button class="custom-btn btn-5">Button</button>
        <button class="custom-btn btn-6">Button</button>
        </div>
    </section>

</body>

</html>
