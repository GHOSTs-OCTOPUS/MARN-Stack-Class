<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            padding: 0px;
            margin: 0px;
        }
        body{
            background-color: gray;
        }


        .main{
            width:100%;
            height:100vh;
            /* background-color: pink; */
            position: relative;
            

        }

        .btn{
            width:200px;
            height:50px;
            position: absolute;
            left:500px;
            top:40%;
            border:2px solid white;
             border-radius: 5px;
            box-shadow: 2px 2px 8px orange ;
            color:black;
            z-index: 1;
             overflow: hidden;
        
            
        }

        .btn::before{
            content: "";
            width:100%;
            /* width:10%; */
            height:100%;
            background-color:orange;
            position: absolute;
            top:0;
            left:0;
            transition: all 0.5s ease;
            border-radius: 5px 5px 5px 5px;
            z-index: -1;
            transform: translate(-80%);
           

        }

        .btn:hover::before{
            /* width:100%; */
             transform: translate(-0%);
           
        }

           .btn:hover{
             border:none;
        }

        /* button2 */

     

            .btn2{
            width:200px;
            height:50px;
            position: absolute;
            left:500px;
            top:60%;
            border:2px solid white;
             border-radius: 5px;
            box-shadow: 2px 2px 8px orange ;
            color:black;
            z-index: 1;
             overflow: hidden;
        
            
        }

          .btn2::before{
            content: "";
            width:100%;
            /* width:10%; */
            height:100%;
            background-color:orange;
            position: absolute;
            top:0;
            left:0;
            transition: all 0.5s ease;
            border-radius: 5px 5px 5px 5px;
            z-index: -1;
            transform: translate(-80%);
           

        }

        .btn2:hover::before{
            /* width:100%; */
             transform: translate(-50%);
           
        }

          .btn2::after{
            content: "";
            width:100%;
            /* width:10%; */
            height:100%;
            background-color:orange;
            position: absolute;
            top:0;
            left:0;
            transition: all 0.5s ease;
            border-radius: 5px 5px 5px 5px;
            z-index: -1;
            transform: translate(80%);
           

        }

           .btn2:hover::after{
            /* width:100%; */
             transform: translate(50%);
           
        }

           .btn2:hover{
             border:none;
        }
    </style>
</head>
<body>
    
  <div class="main">
    
    <button class="btn">click here</button>
    <button class="btn2">click here</button>
  </div>


</body>
</html>
