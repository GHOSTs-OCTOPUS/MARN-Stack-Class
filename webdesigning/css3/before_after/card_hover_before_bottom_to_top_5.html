<!DOCTYPE html>
<html>
<head>
    <title>Bottom to Top Hover</title>

    <style>
        /* container */
        .container {
            position: relative;
            width: 800px;
            height: 300px;
            margin: 50px auto;
        }

        /* card */
        .card {
            position: absolute;
            width: 200px;
            height: 150px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.5s;
        }

        /* positions */
        .card1 { left: 50px; top: 50px; }
        .card2 { left: 300px; top: 50px; }
        .card3 { left: 550px; top: 50px; }

        /* BEFORE effect (Bottom → Top) */
        .card::before {
            content: "";
            position: absolute;
            bottom: 0;      /* start from bottom */
            left: 0;
            width: 100%;
            height: 0%;     /* initially hidden */
            background: orange;
            transition: 0.5s;
            z-index: -1;
        }

        /* hover */
        .card:hover::before {
            height: 100%;   /* fills upward */
        }

        .card:hover {
            color: white;
            transform: translateY(-10px);
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card card1">
            <h3>Card 1</h3>
            <p>First card</p>
        </div>

        <div class="card card2">
            <h3>Card 2</h3>
            <p>Second card</p>
        </div>

        <div class="card card3">
            <h3>Card 3</h3>
            <p>Third card</p>
        </div>

    </div>

</body>
</html>
