<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{
        margin:0px;
        padding:0px;
    }
.outer{
    height:700px;
    width:1100px;
    background-color: cadetblue;
    position:relative;
    background-image: url(img/green_bg.jpg);
    background-repeat: no-repeat;
    background-size:cover;
    border-radius:5% ;
    margin: 20px 200px;

}
.inner{
    height:100px;
    width:100px;
    background-color:black;
    position:absolute;
    border-radius:50%;
    background-image: url(img/soccer-ball.png);
        background-repeat: no-repeat;
    background-size:contain;
    animation: myani 4s 6 ease-out;

}
@keyframes myani {
    
    0%{top:520px;
    left:130px;
    }
    20%{
        top:0px;
        left:280px;

    }
    40%{
        top:600px;
        left:380px;
    }
    60%{
        top:0px;
        left:480px;
    }
    80%{
        top:270px;
        left:685px;
    }
    100%{
        top:230px;
        left:900px;
    }
 

}
.goal{
    position: absolute;
    height:400px;
    width:280px;
    top:150px;
    right:-10px;
    background-image: url(img/goalpng1.PNG);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    
}
.player{

    position: absolute;
    height:200px;
    width:200px;
    top:300px;
    right:300px;
    background-image: url(img/footballkick.png);
    background-repeat: no-repeat;
    background-size: 100% 100%;
}
.player1{

    position: absolute;
    height:200px;
    width:200px;
    top:500px;
    left:10px;
    background-image: url(img/footballkick1.png);
    background-repeat: no-repeat;
    background-size: 100% 100%;
}
</style>
</head>
<body>
    <div class="outer">

        <div class="inner">
            
        </div>
        <div class="goal"></div>
        <div class="player"></div>
        <div class="player1"></div>
    </div>
</body>
</html>
