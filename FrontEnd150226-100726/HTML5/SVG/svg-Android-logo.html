<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Android Logo SVG</title>
  <style>
        body {
            margin: 0;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* copyright */
        .footer {
            display: flex;
            flex-direction: column;
            background: #262526;
            border-top: 1px solid #6d6d6d;
            padding: 25px 0;
            text-align: center;
        }

        .copyright_text {
            color: #000000;
            font-size: 15px;
            margin-left: 30px;
        }

        .copyright_text a {
            font-size: larger;
            font-weight: bold;
            color: #fc95c4;
        }
    </style>
</head>
<body>

<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"  style="background: #f0f0f0; border-radius: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">

  <!-- Body -->
  <rect x="75" y="150" width="150" height="150" rx="20" fill="#3DDC84"/>

  <!-- Head -->
  <rect x="70" y="40" width="150" height="100" rx="50" fill="#3DDC84"/>

  <!-- Eyes -->
  <circle cx="110" cy="100" r="8" fill="white"/>
  <circle cx="180" cy="100" r="8" fill="white"/>

  <!-- Antennas -->
  <line x1="110" y1="60" x2="90" y2="20" stroke="#3DDC84" stroke-width="6"/>
  <line x1="190" y1="60" x2="210" y2="20" stroke="#3DDC84" stroke-width="6"/>

  <!-- Arms -->
  <rect x="40" y="150" width="30" height="120" rx="15" fill="#3DDC84"/>
  <rect x="230" y="150" width="30" height="120" rx="15" fill="#3DDC84"/>

  <!-- Legs -->
  <rect x="100" y="305" width="30" height="80" rx="10" fill="#3DDC84"/>
  <rect x="170" y="305" width="30" height="80" rx="10" fill="#3DDC84"/>

</svg>

<!-- Copyright -->
    <footer>
        <div class="container">
            <p class="copyright_text">&copy;All Rights Reserved. Design by <a
                    href="https://github.com/GHOSTs-OCTOPUS">GHOSTs-OCTOPUS</a> Distribution by <a
                    href="https://cncwebworld.com/">CNC Web World</a></p>
        </div>
    </footer>

</body>
</html>
