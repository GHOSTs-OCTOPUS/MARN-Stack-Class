<!doctype html>
<html>
<head>
<style>
#main{
width:150px;height:150px;background:black;margin-left:50px;margin-top:50px;position:relative;
}
#d1{
width:15px;height:15px;background:white;position:absolute;bottom:15px;left:10px;
border-radius:50%;
animation:myani 1s 0s infinite ;
-webkit-animation:myani 1s 0s infinite ; /* Safari and Chrome */

}

@keyframes myani
{
0%   {bottom:25px;}
50%	{top:80px;}
100% {bottom:25px;}
}

@-webkit-keyframes myani /* Safari and Chrome */
{

0%   {bottom:25px;}
50%	{top:60px;}
100% {bottom:25px;}
}


#d2{
width:15px;height:15px;background:white;position:absolute;bottom:15px;left:30px;
border-radius:50%;
animation:myanim 1s 0.1s infinite ;
-webkit-animation:myanim 1s 0.1s infinite ; /* Safari and Chrome */

}

@keyframes myanim
{
0%   {bottom:25px;}
50%	{top:60px;}
100% {bottom:25px;}
}
@-webkit-keyframes myanim /* Safari and Chrome */
{

0%   {bottom:25px;}
50%	{top:60px;}
100% {bottom:25px;}
}

#d3{
width:15px;height:15px;background:white;position:absolute;bottom:15px;left:50px;
border-radius:50%;
animation:myanim 1s 0.2s infinite ;
-webkit-animation:myanim 1s 0.2s infinite ; /* Safari and Chrome */

}

@keyframes myanim
{
0%   {bottom:25px;}
50%	{top:60px;}
100% {bottom:25px;}
}

@-webkit-keyframes myanim /* Safari and Chrome */
{

0%   {bottom:25px;}
50%	{top:60px;}
100% {bottom:25px;}
}

</style>
</head>
<body>
<div id="main">
<div id="d1"></div>
<div id="d2"></div>
<div id="d3"></div>

</div>

 
</audio>

</body>
</html>
