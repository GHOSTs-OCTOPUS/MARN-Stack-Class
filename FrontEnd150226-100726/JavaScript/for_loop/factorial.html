<html>

<head>
    <script>
        /*
           1)find all odd no beth 1-50 , also their count 
           2)find sum of given interval 1+2+3+...+10=55 
           3)find given no is prime or not prime n=7
           4)find factorial of given no n=5
           */
        // find factorial of given no n=5

        let n = 5;
        let fact = 1;

        for (let i = 1; i <= n; i++) {
            fact = fact * i;
        }

        console.log("Factorial =", fact);
        document.write("Factorial =", fact);

    </script>
</head>
