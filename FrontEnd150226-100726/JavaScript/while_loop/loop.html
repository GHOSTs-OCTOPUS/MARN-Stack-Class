    <script>
        //loop: while for do-while 

        //while :- ini-start  condi exec     1<=10  10>=1

        //print 1-10 no 

        i = 1 //11
        while (i <= 10) {
            document.write(i + "<br>");
            i++; //11

        }



        //10 -1 

        i = 10
        while (i >= 1) {
            document.write(i + "<br>");
            i--;
        }

        document.write("<br>");
        //////////////////////////////////////////////////////////////////////////////////////////////////////

        //find all even no betn 1-50 


        i = 1
        while (i <= 50) {
            if (i % 2 == 0) {
                document.write(i + "<br>");
            }
            i++;


        }

        ///////////////////////////////////////////////////////////////////////////////////////////////////

        

        /////////////////////////////////////////////////////////////////////

        /*
        1)find all odd no beth 1-50 , also their count 
        2)find sum of given interval 1+2+3+...+10=55 
        3)find given no is prime or not prime n=7
        4)find factorial of given no n=5
        */

        //find factorial of given no n=5

        i = 1
        fact = 1
        while (i <= 5) {

            fact = fact * i;
            i++;

        }
        document.write(fact);


        // 1)find all odd no beth 1-50 , also their count 
        let i = 1;
        let count = 0;

        while (i <= 50) {
            if (i % 2 !== 0) {
                console.log(i);
                count++;
            }
            i++;
        }

        console.log("Total odd numbers:", count);
