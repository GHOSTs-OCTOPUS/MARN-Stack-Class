    <script>
        /* class: blue print of object virtual 
         object:- instance of a class  real world entity
        attributes 
        this:- current object
         constructor: special method called when an object of a class is created
         methods: functions defined within a class
        */

        /////////////////////////////////////////////////////////////////////////////////////////
       /* Q1. Create a class called "Car" with attributes brand and color, and a method to display the car's details. 
        Create two car objects and display their details. 
        */
        class car{
            constructor(brand,color){
                this.brand=brand
                this.color=color
            }
            display(){
                console.log("car brand is "+this.brand)
                console.log("car color is "+this.color)
            }
        }
        let car1=new car("Toyota","Red")
        car1.display()
        let car2=new car("Honda","Blue")
        car2.display()

        ////////////////////////////////////////////////////////////////////////////
        /* Q2. Create a class called "Laptop" with attributes brand model and price, and a method to display the laptop's details.
        Create two laptop objects and display their details. 
        */
        class laptop{
            constructor(brand,model,price){
                this.brand=brand
                this.model=model
                this.price=price
            }
            display(){
                console.log("laptop brand is "+this.brand)
                console.log("laptop model is "+this.model)
                console.log("laptop price is "+this.price)
            }
        }
        let laptop1=new laptop("Dell","XPS 13",1000)
        laptop1.display()
        let laptop2=new laptop("Apple","MacBook Pro",1500)
        laptop2.display()

        teacher1.display()
        let teacher2=new teacher("Ms. Johnson","Science",15)

        /* Q4. Create a class called "BankAccount" with attributes accountNumber accountHolder and balance, and a method to display the account details.

        /* Q5. Create a class called "Rectangle" with attributes length and breadth, and a method to calculate the area of the rectangle. 
        Create an object of the Rectangle class and display the area. 
        */
        class Rectangle{
            constructor(length,breadth){
                this.length=length
                this.breadth=breadth
            }
            area(){
                return this.length*this.breadth
            }
        }
        let rect=new Rectangle(5,3)
        console.log("Area of rectangle is "+rect.area())
