<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>




        function fun() {

            document.bgColor = "red"


        }



    </script>
</head>

<body>

    <form name="f1">



        <input type="radio" onclick="fun()" />red
        <input type="radio" onmouseenter="document.bgColor='green'" />green
        <input type="radio" onmouseleave="document.bgColor='yellow'" />yellow


    </form>
</body>

</html>
