<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event in JavaScript Question 2</title>

    <script>
        function changeColor(color) {
            document.getElementById("box").style.backgroundColor = color;
        }
    </script>

    <style>
        #box {
            width: 300px;
            height: 150px;
            border: 2px solid black;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <form name="f1">
        <input type="radio" name="color" onclick="changeColor('red')"> Red
        <input type="radio" name="color" onclick="changeColor('green')"> Green
        <input type="radio" name="color" onclick="changeColor('yellow')"> Yellow
    </form>

    <div id="box">
        <h1>Color Box</h1>
    </div>

</body>

</html>
