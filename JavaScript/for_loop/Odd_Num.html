<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        /*
         1)find all odd no beth 1-50 , also their count 
         2)find sum of given interval 1+2+3+...+10=55 
         3)find given no is prime or not prime n=7
         4)find factorial of given no n=5
         */

        // 1)find all odd no beth 1-50 , also their count 
        let count = 0;

        for (let i = 1; i <= 50; i++) {
            if (i % 2 !== 0) {
                console.log(i);
                document.write(i+"<br>");
                count++;
            }
        }

        console.log("Total odd numbers:", count);
        document.write("Total odd numbers:", count);

    </script>
