<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            width:1000px;
            height:2000px;
            background-color: black;
            position: relative;
            z-index:15;
            opacity: 0.5;
        }

        .inner{
            width:800px;
            height:50px;
            background-color: yellow;
            position: absolute;
            top:200px;
            left:500px;
            z-index: 8;
        }

           .inner2{
            width:800px;
            height:50px;
            background-color: yellow;
            position: fixed;
            top:300px;
            left:100px;
            z-index: 9;
        }
    </style>
</head>
<body>

    <div class="outer">
      
    </div>
    
      <div class="inner"> 1</div>
      <div class="inner2"> 2</div>
</body>
</html>
